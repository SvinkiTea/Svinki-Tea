<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svinki Tea — Магазин китайского чая и посуды</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FDFBF7;
            --card-bg: #FFFFFF;
            --text-main: #2C221E;
            --accent: #C05A46;
            --accent-hover: #A54B38;
            --border: #EAE3D9;
            --tag-bg: #F4EFEB;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .cart-btn:hover {
            background: var(--accent-hover);
        }

        .hero {
            position: relative;
            text-align: center;
            padding: 5rem 1rem;
            background: linear-gradient(rgba(44, 34, 30, 0.6), rgba(44, 34, 30, 0.6)), 
                        url('https://images.unsplash.com/photo-1576092768241-dec231879fc3?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            color: #FFFFFF;
            border-bottom: 1px solid var(--border);
            overflow: hidden;
            animation: fadeIn 1s ease-out;
        }

        .hero h1 {
            font-size: 2.8rem;
            margin-bottom: 0.8rem;
            color: #FFFFFF;
            animation: slideUp 0.8s ease-out;
        }

        .hero p {
            color: #F4EFEB;
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
            animation: slideUp 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .products-grid {
            display: grid;grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .product-img {
            height: 180px;
            background: #EAE3D9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #887C75;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .product-info {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-category {
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
            cursor: pointer;
            color: var(--text-main); /* Возвращен стандартный темный цвет */
            transition: color 0.2s;
        }

        .product-title:hover {
            color: var(--accent);
        }

        .product-desc {
            font-size: 0.9rem;
            color: #665C58;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .buy-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            font-size: 0.85rem;
        }

        .buy-btn:hover {
            background: var(--accent-hover);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 550px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .checkout-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
        }
        
        .checkout-btn:hover {
            background: var(--accent-hover);
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo"><img src="logo.png" alt="Icon" style="height: 40px; width: 40px; border-radius: 50%; object-fit: cover;">
            <span>Svinki Tea</span>
        </a>
        <button class="cart-btn" onclick="openCart()">
            🛒 Корзина <span id="cart-count">0</span>
        </button>
    </header>

    <div class="hero">
        <h1>Магазин китайского чая и посуды</h1>
        <p>Настоящие пуэры, улуны и фарфор для вашей чайной церемонии</p>
    </div>

    <div class="container">
        <div class="filters">
            <button class="filter-btn active" onclick="filterCategory('all')">Все товары</button>
            <button class="filter-btn" onclick="filterCategory('puer')">Шу и Шен Пуэр</button>
            <button class="filter-btn" onclick="filterCategory('oolong')">Улуны</button>
            <button class="filter-btn" onclick="filterCategory('green')">Зеленый чай</button>
            <button class="filter-btn" onclick="filterCategory('dishes')">Посуда</button>
        </div>

        <div class="products-grid" id="products-grid">
            <!-- Products will be injected via JS -->
        </div>
    </div>

    <!-- Modal Cart -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Ваша корзина</h2>
                <button class="close-btn" onclick="closeCart()">&times;</button>
            </div>
            <div id="cart-items-list">
                <p>Корзина пуста</p>
            </div>
            <div style="margin-top: 1.5rem; font-weight: 700; font-size: 1.2rem;">
                Итого: <span id="cart-total">0</span> ₽
            </div>
            <button class="checkout-btn" onclick="checkout()">Оформить заказ в Telegram</button>
        </div>
    </div>

    <!-- Modal Product Details -->
    <div class="modal" id="product-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title" style="font-size: 1.3rem;">Название</h2>
                <button class="close-btn" onclick="closeProductModal()">&times;</button>
            </div>
            <div id="modal-body" style="font-size: 0.95rem; color: #555; line-height: 1.6;">
                <!-- Подробности -->
            </div>
            <div style="margin-top: 1.5rem; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 1rem;">
                <div>
                    <span id="modal-price" style="font-size: 1.3rem; font-weight: 700;">0 ₽</span>
                    <span id="modal-stock" style="font-size: 0.85rem; color: #776; display: block;">Наличие: 0 шт.</span>
                </div>
                <button class="buy-btn" id="modal-add-btn" style="padding: 0.7rem 1.5rem;">В корзину</button>
            </div>
        </div>
    </div>

    <script>
        const products = [
            { 
                id: 1, 
                title: "Монетка Шу Пуэра с зелёным мандарином", 
                category: "puer", 
                price: 30, 
                unit: "шт",
                stock: 15,
                desc: "Союз выдержанной глубины и цитрусовой свежести. Ноты цедры и сушёной дыни.", 
                details: {
                    state: "Мягкое согревание, ясность ума.",
                    brew: "95–100°C, метод пролива (гайвань). До 7 честных заварок.",
                    aroma: "Цедра зелёного мандарина, сушёная дыня, древесная кора.",
                    taste: "Густой маслянистый пуэр с медовой сладостью и кислинкой цитруса.",
                    guide: "1 «монетка» на 150 мл воды. Проливами от 10–15 секунд."
                },
                img: "Фото чая" 
            },{ id: 2, title: "Да Хун Пао", category: "oolong", price: 520, unit: "50г", stock: 5, desc: "Классический сильноферментированный улун с минеральным послевкусием.", details: { state: "Бодрость и фокус", brew: "95°C, проливы", aroma: "Огненные ноты, карамель", taste: "Мягкий, долгий сладковатый финиш", guide: "5г на 100 мл кипятка" }, img: "Фото чая" },
            { id: 3, title: "Те Гуань Инь", category: "oolong", price: 390, unit: "50г", stock: 8, desc: "Светлый улун с ярким цветочно-травянистым ароматом.", details: { state: "Легкость, гармония", brew: "85–90°C", aroma: "Луговые цветы, сирень", taste: "Свежий, сладковатый", guide: "6г на 100 мл" }, img: "Фото чая" },
            { id: 4, title: "Синьян Маоцзянь", category: "green", price: 480, unit: "50г", stock: 4, desc: "Элитный зеленый чай с мягким освежающим вкусом.", details: { state: "Тонизирует", brew: "80°C", aroma: "Свежая зелень, орех", taste: "Нежный, без горечи", guide: "4г на 150 мл" }, img: "Фото чая" },
            { id: 5, title: "Гайвань керамическая 120мл", category: "dishes", price: 890, unit: "шт", stock: 2, desc: "Классическая белая гайвань для заваривания проливами.", details: { state: "Инструмент церемонии", brew: "Для любых чаев", aroma: "-", taste: "-", guide: "Классический объем 120 мл" }, img: "Фото посуды" },
            { id: 6, title: "Пиала глиняная", category: "dishes", price: 350, unit: "шт", stock: 6, desc: "Удобная пиала, отлично держит тепло чая.", details: { state: "Уют чаепития", brew: "Для проливов", aroma: "-", taste: "-", guide: "Ручная работа" }, img: "Фото посуды" }
        ];

        let cart = [];

        function renderProducts(filter = 'all') {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);
            
            filtered.forEach(product => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-img" onclick="openProductModal(${product.id})">${product.img}</div>
                        <div class="product-info">
                            <span class="product-category">${getCategoryName(product.category)}</span>
                            <h3 class="product-title" onclick="openProductModal(${product.id})">${product.title}</h3>
                            <p class="product-desc">${product.desc}</p>
                            <div class="product-footer">
                                <span class="product-price">${product.price} ₽</span>
                                <button class="buy-btn" onclick="addToCart(${product.id})">В корзину</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function getCategoryName(cat) {
            const names = { puer: 'Пуэр', oolong: 'Улун', green: 'Зеленый чай', dishes: 'Посуда' };
            return names[cat] || cat;
        }

        function filterCategory(cat) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderProducts(cat);
        }

        function openProductModal(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            document.getElementById('modal-title').innerText = product.title;
            document.getElementById('modal-price').innerText = `${product.price} ₽ / ${product.unit}`;
            document.getElementById('modal-stock').innerText = `Наличие: ${product.stock} ${product.unit}`;
            
            let html = `<p style="margin-bottom: 1rem; font-weight: 500; color: var(--text-main);">${product.desc}</p>`;
            if (product.details) {
                html += `<div style="background: var(--tag-bg); padding: 1rem; border-radius: 8px; margin-bottom: 1rem;">
                        <p><strong>★ Состояние:</strong> ${product.details.state}</p>
                        <p><strong>★ Заварка:</strong> ${product.details.brew}</p>
                        <p><strong>★ Аромат:</strong> ${product.details.aroma}</p>
                        <p><strong>★ Вкус:</strong> ${product.details.taste}</p>
                    </div>
                    <p><strong>Способ заваривания:</strong> ${product.details.guide}</p>
                `;
            }
            document.getElementById('modal-body').innerHTML = html;

            const addBtn = document.getElementById('modal-add-btn');
            addBtn.onclick = function() {
                addToCart(product.id);
                closeProductModal();
            };

            document.getElementById('product-modal').style.display = 'flex';
        }

        function closeProductModal() {
            document.getElementById('product-modal').style.display = 'none';
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const cartItem = cart.find(item => item.id === id);
            if (cartItem) {
                cartItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.quantity, 0);
            
            const list = document.getElementById('cart-items-list');
            const totalElem = document.getElementById('cart-total');
            
            if (cart.length === 0) {
                list.innerHTML = '<p>Корзина пуста</p>';
                totalElem.innerText = '0';
                return;
            }

            list.innerHTML = '';
            let total = 0;
            
            cart.forEach(item => {
                total += item.price * item.quantity;
                list.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <strong>${item.title}</strong><br>
                            <small>${item.price} ₽ x ${item.quantity} ${item.unit}</small>
                        </div>
                        <button onclick="removeFromCart(${item.id})" style="background:none;border:none;color:red;cursor:pointer;">Удалить</button>
                    </div>
                `;
            });
            
            totalElem.innerText = total;
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function openCart() {
            document.getElementById('cart-modal').style.display = 'flex';
        }

        function closeCart() {
            document.getElementById('cart-modal').style.display = 'none';
        }

        function checkout() {
            if (cart.length === 0) return alert('Корзина пуста');
            
            let message = "Здравствуйте! Хочу сделать заказ в Svinki Tea:%0A";
            let total = 0;
            
            cart.forEach(item => {
                message += `- ${item.title} (${item.quantity} ${item.unit}) — ${item.price * item.quantity} ₽%0A`;
                total += item.price * item.quantity;
            });
            
            message += `%0AИтого: ${total} ₽`;
            window.open(`https://t.me/YOUR_TELEGRAM_USERNAME?text=${message}`, '_blank');
        }

        renderProducts();
    </script>
</body>
</html>
